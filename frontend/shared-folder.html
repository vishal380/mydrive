<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared folder - MyDrive</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .public-folder-page { min-height: 100vh; padding: 32px 16px; background: #f5f7fb; }
        .public-folder-card { width: min(900px, 100%); margin: auto; padding: 28px; border-radius: 16px; background: #fff; box-shadow: 0 12px 40px #18243a18; }
        .public-folder-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
        .public-folder-heading h1 { margin: 0; overflow-wrap:anywhere; }
        .public-folder-meta { color:#64748b; }
        .public-folder-list { margin:24px 0 0; padding:0; list-style:none; }
        .public-folder-list li { display:flex; justify-content:space-between; gap:16px; padding:14px 4px; border-top:1px solid #e2e8f0; }
        .public-folder-file { min-width:0; overflow-wrap:anywhere; }
        .public-folder-file small { display:block; color:#64748b; margin-top:4px; }
        .public-folder-error { color:#b42318; }
        @media(max-width:520px) { .public-folder-card {padding:20px;} .public-folder-list li {align-items:flex-start;} }
    </style>
</head>
<body>
    <main class="public-folder-page">
        <section class="public-folder-card" aria-live="polite">
            <p>MyDrive shared folder</p>
            <div class="public-folder-heading">
                <h1 id="folderName">Loading folder…</h1>
                <a id="downloadFolder" class="btn primary" hidden>Download folder</a>
            </div>
            <p id="folderDetails" class="public-folder-meta"></p>
            <p id="folderError" class="public-folder-error" hidden></p>
            <ul id="folderFiles" class="public-folder-list"></ul>
            <p><a class="btn secondary" href="/">Go to MyDrive</a></p>
        </section>
    </main>
    <script src="/js/shared-folder.js?v=public-folder-share"></script>
</body>
</html>
