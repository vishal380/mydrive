<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MyDrive</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                ☁
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your MyDrive account
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div class="forgot-password">

                    <a href="/forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <div
                    id="loginMessage"
                    class="message"
                ></div>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>

            <p class="auth-footer">

                Don't have an account?

                <a href="/register.html">
                    Create Account
                </a>

            </p>

            <p class="auth-footer">

                <a href="/">
                    ← Back to MyDrive
                </a>

            </p>

        </div>

    </div>

    <script src="/js/login.js"></script>

</body>

</html>
